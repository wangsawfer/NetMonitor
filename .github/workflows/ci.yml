name: CI

# The program only runs on Windows (ETW, Npcap, Win32 endpoints), so this is a
# Windows-only pipeline.
#
# Two levels of checking:
#
#   * `cargo check --all-targets` needs no Npcap SDK and always runs. It
#     type-checks the library, the binaries and the test code.
#   * `cargo test` / `cargo build --release` link against `wpcap.lib`, which
#     comes from the Npcap SDK. The SDK is downloaded from npcap.com at run
#     time; when that download fails (offline runner, certificate chain not
#     valid on the runner's clock, npcap.com unavailable) the job still
#     succeeds with the check above and prints a warning, rather than failing
#     for a dependency it cannot control.
#
# The tests that need elevation skip themselves when they cannot get it.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Builds land here rather than in the repository, matching local layout.
  CARGO_TARGET_DIR: ${{ github.workspace }}\.cache\target
  NETMON_NPCAP_SDK: ${{ github.workspace }}\.cache\deps\npcap-sdk
  # The Npcap SDK is a link-time dependency only.
  NPCAP_SDK_VERSION: "1.15"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('netmon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Try to fetch the Npcap SDK (link-time only)
        id: npcap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = $env:NETMON_NPCAP_SDK
          $lib = Join-Path $dest 'Lib\x64\wpcap.lib'
          $ok = $true
          if (Test-Path $lib) {
            Write-Host "Npcap SDK already present at $dest"
          } else {
            try {
              $zip = Join-Path $env:RUNNER_TEMP "npcap-sdk-$env:NPCAP_SDK_VERSION.zip"
              $url = "https://npcap.com/dist/npcap-sdk-$env:NPCAP_SDK_VERSION.zip"
              Write-Host "downloading $url"
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              # The archive's root is Include/ + Lib/, which is exactly the
              # layout build.rs expects (see scripts/install.ps1).
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Expand-Archive -Path $zip -DestinationPath $dest -Force
              if (-not (Test-Path $lib)) { throw "wpcap.lib not found at $lib after extracting $zip" }
            } catch {
              $ok = $false
              Write-Host "::warning title=Npcap SDK unavailable::Could not fetch the Npcap SDK: $($_.Exception.Message) -- link-dependent steps will be skipped."
            }
          }
          "sdk=$($ok.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: cargo check (no SDK required)
        run: cargo check --manifest-path netmon/Cargo.toml --all-targets

      - name: cargo test (needs the Npcap SDK)
        if: steps.npcap.outputs.sdk == 'true'
        run: cargo test --manifest-path netmon/Cargo.toml --bins --no-fail-fast

      - name: cargo build (release, needs the Npcap SDK)
        if: steps.npcap.outputs.sdk == 'true'
        run: cargo build --manifest-path netmon/Cargo.toml --bins --release
